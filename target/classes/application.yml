spring:
  application:
    name: trade-optimizer-service

  datasource:
    url: jdbc:postgresql://localhost:5432/tradeoptimizer
    username: tradeoptimizer
    password: tradeoptimizer
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081